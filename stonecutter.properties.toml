# general
mod.id = "simple_death_improvements"
mod.name = "Simple Death Improvements"
mod.group = "me.pajic"
mod.version = "1.6.0"
mod.description = "Less frustrating deaths - no item despawn, no item splatter, item safeguards and more"
mod.authors = "pajic"
mod.contributors = ""
mod.license = "MIT"

# links
mod.sources_url = "https://github.com/pajicadvance/simple-death-improvements"
mod.homepage_url = "https://modrinth.com/mod/simple-death-improvements"
mod.issues_url = "https://github.com/pajicadvance/simple-death-improvements/issues"
mod.discord_url = "https://discord.gg/5RkzS66zWb"

# publishing
publish.modrinth = "2JFsuD70"
publish.curseforge = "1163907"
publish.env.mr = "SERVER_ONLY" #https://modmuss50.github.io/mod-publish-plugin/platforms/modrinth/#all-options
publish.env.cf.client = false
publish.env.cf.server = true
publish.dry_run = false

# loom
loomx.loom_version = "1.17-SNAPSHOT"

# dependencies
loader.fabric = "0.19.5"
dep.mixinconstraints.coords = "com.moulberry:$id:$version"
dep.fzzy_config.coords = "me.fzzyhmstrs:$id:$version"
dep.fzzy_config.slug = "fzzy-config"
dep.trinkets.coords = "eu.pb4:$id:$version"
dep.ohmega.coords = "maven.modrinth:$id:$version-$loader,$mc"
dep.curios.coords = "top.theillusivec4.$id:$id-$loader:$version"
dep.sodium.coords = "net.caffeinemc:$id-$loader:$version"
include.mixinconstraints = "1.1.0"

[fabric]
dep.fabric-api.coords = "net.fabricmc.fabric-api:$id:$version"
dep.modmenu.coords = "com.terraformersmc:$id:$version"
dep.ohmega.range = ">=1.5.21 <1.6"
dev.runtime_optionals = ["modmenu", "trinkets"]

[neoforge]
dep.ohmega.range = "[1.5.21, 1.6)"
dev.runtime_optionals = ["curios"]


["1.21.1"]
mod.mc_releases = ["1.21", "1.21.1"]
loader.neo = "21.1.250"
dep.trinkets.coords = "dev.emi:$id:$version"
optional.ohmega = "1.5.21"
runtime.sodium = "0.8.13+mc1.21.1"

[fabric."1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
required.fabric-api = "0.116.17+1.21.1"
required.fzzy_config = "0.7.6+1.21"
optional.trinkets = "3.10.0"
runtime.modmenu = "11.0.4"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21, 1.21.1]"
required.fzzy_config = "0.7.6+1.21+neoforge"
optional.curios = "9.5.1+1.21.1"


["26.1"]
